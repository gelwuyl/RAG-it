chunking:
  chunk_overlap: 75
  chunk_size: 512
  splitter: recursive
embedding:
  # Qwen3 Embedding 8B via OpenRouter, requested at 768-dim (see
  # ragchat/embeddings.py dimensions=768). 768-dim keeps it UNDER pgvector's
  # 2000-dim HNSW index ceiling, so ANN indexing works on Neon.
  #
  # Chosen over Google's gemini-embedding-001 on SUSTAINED throughput, which is
  # what governs whether a document finishes indexing at all. Measured live:
  #
  #   gemini (free tier)  ~100 chunks/minute   hard quota ceiling
  #   openrouter          384 chunks in 12.5s  (30.6/sec, no throttling)
  #
  # Burst latency is near-identical (1.66s vs 1.47s per 16 chunks); the gap is
  # entirely quota. Gemini's free tier counts each TEXT against its 100/minute
  # limit, not each HTTP call, so batching cannot work around it.
  #
  # ONE model for guests and accounts alike. Per-tier models were considered and
  # rejected: vectors from different models are not comparable, so a promoted
  # guest workspace would go silent at exactly the moment the app promises
  # "your work comes with you". Guest cost is bounded by the caps in
  # ragchat/guests.py instead.
  model: qwen/qwen3-embedding-8b
generation:
  # Gemma 4 26B instruct, served by Google AI Studio's OpenAI-compatible
  # endpoint. Used for generation AND the eval LLM-as-judge.
  #
  # MEASURED against gemini-3.5-flash-lite over the full 56-question golden set,
  # which is why it is back. Flash-lite lost 6.5 points of answer correctness
  # (0.8696 -> 0.8049) and 2 points of faithfulness, and — because the judge
  # runs on whatever model just answered — nearly doubled the answers it could
  # not grade at all (8 -> 14 of 53). Retrieval was identical either way, so
  # the whole difference was the model's own work.
  #
  # The id must be exact: the endpoint 404s on near-misses, and the bare
  # "gemma-4-26b-it" is NOT in the live /v1/models catalog.
  #
  # NOTE this key is masked by a config_overrides row if the Settings UI has
  # ever been saved on a deployment. Changing it here does nothing on such a
  # deployment until the override is cleared — check GET /api/health, which
  # reports the EFFECTIVE model rather than this file's opinion of it, and
  # Settings -> Reset to shipped defaults to clear one.
  llm_model: models/gemma-4-26b-a4b-it
  temperature: 0.0
  # NOTE: there is no `web_augmentation` key here any more, and nothing reads
  # one. Web fallback is gone; deep search replaced it (ragchat/deepsearch.py).
  #
  # It is deliberately NOT a config key. `config_overrides` is a single row
  # shared by the whole deployment, so a stored flag would let one visitor
  # change retrieval for everyone — which is precisely what the web toggle did.
  # Deep search is sent per question, on the ask request.
query:
  query_rewrite: true
retrieval:
  candidate_k: 20
  # NOTE: there is no `hybrid_search` key here on purpose.
  #
  # Keyword fusion is unconditional — see the comment in config.py's load_config.
  # It costs no model call (in-memory BM25 locally, stateless Postgres full-text
  # search on Neon, RRF k=60 in Python either way), it is what makes exact strings
  # like part numbers and form codes rank as well as paraphrases, and it is what
  # the landing page has always advertised. Adding the key back here would have
  # no effect: nothing reads it.
  # On by default, and served by Cohere rerank-v3.5 (see the `reranker` block
  # below). Measured: rerank-on gave the best recall and MRR of the four
  # presets. It is ONE cheap purpose-built call for the whole candidate pool,
  # not one model call per chunk like the cross-encoder path, so "on" costs a
  # fraction of what it used to and the Balanced preset can afford it.
  reranker: true
  similarity_threshold: 0.0
  top_k: 4
# NOTE: there is no top-level `reranker.provider` key here either, and for the
# same reason as hybrid_search above — load_config() hardcodes it, so nothing
# would read it. Reranking is served by Cohere rerank-v3.5 via OpenRouter: one
# cheap purpose-built call for the whole candidate pool. The old LLM
# cross-encoder scored one chat call PER passage, which was slower and dearer
# for no measured gain. WHETHER to rerank is still a setting (retrieval.reranker
# above); which vendor does it is not.
