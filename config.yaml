chunking:
  chunk_overlap: 75
  chunk_size: 512
  splitter: recursive
embedding:
  # Google Gemini embedding model (3072-dim) via the OpenAI-compatible endpoint.
  # `gemini-embedding-001` is Google's documented GA embedding slug (free tier
  # available). Switching model auto-creates a fresh per-(user, model) Chroma
  # collection (see ragchat/store.py), so no manual reindex flag is needed.
  model: gemini-embedding-001
generation:
  # Open-weight Gemma 3 27B instruct, served by Google AI Studio's
  # OpenAI-compatible endpoint (generous free tier). Used for generation AND
  # the eval LLM-as-judge.
  llm_model: gemma-3-27b-it
  temperature: 0.0
  # Web augmentation is a FALLBACK ONLY (PRD F13): when on, web results are
  # appended as labeled [web] chunks only when the user's own documents do
  # not clear the relevance threshold. It never overrides a grounded answer.
  # Default off so answers stay strictly grounded in the user's documents.
  web_augmentation: false
query:
  query_rewrite: true
retrieval:
  candidate_k: 20
  hybrid_search: false
  reranker: false
  similarity_threshold: 0.0
  top_k: 4
