chunking:
  chunk_overlap: 75
  chunk_size: 512
  splitter: recursive
embedding:
  # Qwen3 Embedding 8B via OpenRouter, requested at 768-dim (see
  # ragchat/embeddings.py dimensions=768). 768-dim keeps it UNDER pgvector's
  # 2000-dim HNSW index ceiling, so ANN indexing works on Neon.
  #
  # Chosen over Google's gemini-embedding-001 on SUSTAINED throughput, which is
  # what governs whether a document finishes indexing at all. Measured live:
  #
  #   gemini (free tier)  ~100 chunks/minute   hard quota ceiling
  #   openrouter          384 chunks in 12.5s  (30.6/sec, no throttling)
  #
  # Burst latency is near-identical (1.66s vs 1.47s per 16 chunks); the gap is
  # entirely quota. Gemini's free tier counts each TEXT against its 100/minute
  # limit, not each HTTP call, so batching cannot work around it.
  #
  # ONE model for guests and accounts alike. Per-tier models were considered and
  # rejected: vectors from different models are not comparable, so a promoted
  # guest workspace would go silent at exactly the moment the app promises
  # "your work comes with you". Guest cost is bounded by the caps in
  # ragchat/guests.py instead.
  model: qwen/qwen3-embedding-8b
generation:
  # Gemma 4 26B instruct, served by Google AI Studio's OpenAI-compatible
  # endpoint. Used for generation AND the eval LLM-as-judge. The proxy exposes
  # it as models/gemma-4-26b-a4b-it (the bare "gemma-4-26b-it" is NOT in the
  # live /v1/models catalog and 404s).
  llm_model: models/gemma-4-26b-a4b-it
  temperature: 0.0
  # Web augmentation is a FALLBACK ONLY (PRD F13): when on, web results are
  # appended as labeled [web] chunks only when the user's own documents do
  # not clear the relevance threshold. It never overrides a grounded answer.
  # Default off so answers stay strictly grounded in the user's documents.
  web_augmentation: false
query:
  query_rewrite: true
retrieval:
  candidate_k: 20
  # Keyword fusion is ON by default and is no longer a user-facing switch.
  #
  # It is not a preference a visitor can reason about — "should BM25 scores be
  # fused into the vector ranking by RRF" is an implementation detail — and it
  # was exposed as a topbar toggle that guests could not use anyway, since config
  # is deployment-wide. Meanwhile the landing page advertised "hybrid retrieval,
  # fused" while the shipped default did vector-only, so the app under-delivered
  # its own headline.
  #
  # It costs no model call (in-memory BM25 locally, stateless Postgres full-text
  # search on Neon, RRF k=60 in Python either way) and it is what makes exact
  # strings — part numbers, form codes, names — rank as well as paraphrases.
  # Still tunable in Settings -> Advanced for anyone who wants vector-only.
  hybrid_search: true
  reranker: false
  similarity_threshold: 0.0
  top_k: 4
