chunking:
  chunk_overlap: 75
  chunk_size: 512
  splitter: recursive
embedding:
  # Google text-embedding-004 (768-dim) via the OpenAI-compatible endpoint.
  # 768-dim keeps it UNDER pgvector's 2000-dim HNSW index ceiling (so ANN
  # indexing works on Neon), and is Google's recommended/quality tier.
  model: text-embedding-004
generation:
  # Open-weight Gemma 4 26B MoE instruct, served by Google AI Studio's
  # OpenAI-compatible endpoint. Used for generation AND the eval LLM-as-judge.
  llm_model: gemma-4-26b-it
  temperature: 0.0
  # Web augmentation is a FALLBACK ONLY (PRD F13): when on, web results are
  # appended as labeled [web] chunks only when the user's own documents do
  # not clear the relevance threshold. It never overrides a grounded answer.
  # Default off so answers stay strictly grounded in the user's documents.
  web_augmentation: false
query:
  query_rewrite: true
retrieval:
  candidate_k: 20
  hybrid_search: false
  reranker: false
  similarity_threshold: 0.0
  top_k: 4
