[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG chat backend (FastAPI + pgvector on Neon)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.133.1",
    "uvicorn==0.41.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "starlette==1.3.1",
    "SQLAlchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "pgvector==0.5.0",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "openai==2.24.0",
    "requests==2.33.0",
    "beautifulsoup4==4.15.0",
    "PyYAML==6.0.3",
    "python-multipart==0.0.32",
    "sse-starlette==3.3.2",
    "langchain-core==1.5.5",
    "langchain-text-splitters==1.1.2",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "pypdf",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "python-dotenv",
    "tiktoken",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
